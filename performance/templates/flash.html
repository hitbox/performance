{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<aside class="flash noprint">
    <ul id=flashes class=flat>
        {% for category, message in messages %}
        <li class="flash {{ category or 'info'  }}">
            <div class="message">{{ message|safe }}</div>
            <div class="click close">&times</div>
        </li>
        {% endfor %}
    </ul>
</aside>
{% endif %}
{% endwith %}

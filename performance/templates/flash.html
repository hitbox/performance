{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<aside class="flash noprint">
    <ul class="flat flashes">
        {% for category, message in messages %}
        <li class="flash {{ category or 'info'  }}">
            <div class="message">{{ message|safe }}</div>
            <div class="close click" onclick="this.parentNode.parentNode.removeChild(this.parentNode);">&times</div>
        </li>
        {% endfor %}
    </ul>
</aside>
{% endif %}
{% endwith %}

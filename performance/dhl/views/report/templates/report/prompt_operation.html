{% extends "base.html" -%}

{%- block main %}<article>
    <h1>New Report</h1>
    <h3>{{ report_date.strftime(config.DATEFMT) }}</h3>
    <h3>{{ scheduled_report.name }}</h3>
    <h3>For Operation</h3>
    {% for operation in operations %}
    <h4>
        <a href="{{ url_for('report.create_report_from_schedule', report_date=report_date, schedule_id=scheduled_report.id, operation_id=operation.id) }}">{{ operation.name }}</a>
    </h4>
    {% endfor %}
</article>{% endblock main -%}

{% extends "report/edit-base.html" %}

{% block main_inner %}
<form action="{{ url_for(request.endpoint, **request.view_args) }}" method=post>
    {{ form.hidden_tag() }}
    <h3>{{ form[request.view_args.attrname].label }}</h3>
    <p>{{ form[request.view_args.attrname] }}</p>
    {{ form.submit }}
</form>
{% endblock main_inner %}

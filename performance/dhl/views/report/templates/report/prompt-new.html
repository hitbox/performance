{% extends "base.html" -%}

{% block main %}<article>
    <h1>New Report</h1>
    <h3>{{ report_date.strftime(config.DATEFMT) }}</h3>
    <h4>
        <a href="{{ url_for('report.create_report_blank', report_date=report_date) }}">Create blank report</a>
    </h4>
    <h4>
        <a href="{{ url_for('report.import_excel_schedule', report_date=report_date) }}">Import Excel schedule file</a>
    </h4>
    {% if config.ENV == 'development' %}
    <h2>Development-Only</h2>
    <h3>Random</h3>
    <h4>
        <a href="{{ url_for('report.create_random_report', report_date=request.view_args.report_date) }}">Create random report</a>
    </h4>
    {% endif %}{# env == development #}
</article>{% endblock main %}
